<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Яндекс Блокировщик Рекламы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="logo" aria-hidden="true">AD</div>
        <h1>Яндекс Блокировщик Рекламы</h1>
    </div>
    
    <div class="status">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-text" id="statusText">Активен</div>
        </div>
    </div>
    
    <div class="stats">
        <h3>Статистика</h3>
        <div class="stats-item">
            <span class="stats-label">Заблокировано на этой странице:</span>
            <span class="stats-value" id="blockedCount">0</span>
        </div>
        <div class="stats-item">
            <span class="stats-label">Всего заблокировано:</span>
            <span class="stats-value" id="totalBlocked">0</span>
        </div>
    </div>
    
    <div class="controls">
        <button class="toggle-button" id="toggleButton">Отключить на этой странице</button>
    </div>
    
    <div class="info">
        Версия 1.1 | Блокирует рекламу в поисковой выдаче Яндекса
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
